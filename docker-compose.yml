services:
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/dynamic:/dynamic"
    networks:
      - portscale-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - portscale-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: ./control-plane
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./portscale.db}
      - REDIS_URL=redis://redis:6379
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-changeme}
      - JWT_SECRET=${JWT_SECRET:-supersecret-change-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL:-http://localhost:8000}
      - DYNAMIC_CONFIG_DIR=/dynamic
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./traefik/dynamic:/dynamic"
      - "portscale-db:/app"        # Persist SQLite database
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - portscale-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  celery-worker:
    build:
      context: ./control-plane
    command: celery -A app.worker.tasks worker --loglevel=info --concurrency=2 -E
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./portscale.db}
      - REDIS_URL=redis://redis:6379
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-changeme}
      - JWT_SECRET=${JWT_SECRET:-supersecret-change-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL:-http://localhost:8000}
      - DYNAMIC_CONFIG_DIR=/dynamic
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./traefik/dynamic:/dynamic"
      - "portscale-db:/app"        # Share same SQLite database volume
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    networks:
      - portscale-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker.tasks", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3


  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_API_URL must point to the host-accessible URL (not the Docker service name)
      # because it's used by the browser, not by the Next.js server
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - portscale-net
    restart: unless-stopped

volumes:
  redis-data:
  portscale-db:

networks:
  portscale-net:
    driver: bridge
    name: portscale-net
